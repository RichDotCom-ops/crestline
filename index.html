<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crestline</title><meta name="theme-color" content="#0f1110">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Crestline">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<style>
:root{--bg:#0f1110;--cd:#1a1d1b;--c2:#252927;--tx:#f4f6f2;--mu:#8d948e;--ac:#ccf35a;--ln:#2b302d;--bad:#ff7b7b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:430px;margin:0 auto;min-height:100dvh;padding:calc(14px + env(safe-area-inset-top)) 18px calc(110px + env(safe-area-inset-bottom))}
main>*{animation:up .45s cubic-bezier(.2,.8,.2,1) both}main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(n+4){animation-delay:.15s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
small{color:var(--mu);font-size:12.5px}h1{font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:18px 0 10px;text-align:center}h1 span{color:var(--mu)}
h2{font-size:18px;margin:0}.bad{color:var(--bad)}.ok{color:var(--ac)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.gr{flex:1;display:flex;flex-direction:column}.gr b{font-size:17px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ccf35a,#6fd6a0);color:#0f1110;display:grid;place-items:center;font-weight:800;font-size:18px}
button{font:inherit;border:0;cursor:pointer;transition:transform .15s}button:active{transform:scale(.96)}
.ib{width:40px;height:40px;border-radius:50%;background:var(--c2);border:1px solid var(--ln);display:grid;place-items:center;padding:0;color:var(--tx);font-size:18px}
.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pri{background:var(--ac);color:#0f1110;font-weight:800;border-radius:99px;padding:17px;width:100%;font-size:16px}.pri.sm{width:auto;padding:12px 20px;font-size:14px}
.ghost{background:var(--c2);color:var(--tx);font-weight:700;border-radius:99px;padding:12px 18px}.x{background:none;color:var(--mu);padding:4px 8px}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(430px,100%);padding:30px 18px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%)}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:24px;padding:16px;margin-bottom:12px}
.hb{position:relative;border-radius:30px;padding:22px;margin-bottom:14px;border:1px solid var(--ln);background:radial-gradient(120% 110% at 100% 0,rgba(204,243,90,.22),transparent 60%),var(--cd)}
.hb .ib{position:absolute;top:16px;right:16px}.amt{font-size:46px;font-weight:800;letter-spacing:-.04em;margin:4px 0 12px}
.tag{display:inline-block;background:rgba(204,243,90,.14);color:var(--ac);font-weight:700;font-size:13px;border-radius:99px;padding:6px 12px}
.sh{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 12px}.sh a{color:var(--mu);font-size:13px;cursor:pointer}
input,select{width:100%;background:var(--c2);border:1.5px solid transparent;color:var(--tx);border-radius:16px;padding:14px 15px;font:inherit;outline:none}input:focus,select:focus{border-color:var(--ac)}input::placeholder{color:#667068}
label{display:block;font-size:13px;font-weight:700;color:var(--mu);margin:14px 0 6px}.row{display:flex;gap:8px;align-items:center}.row>input{flex:1;min-width:0}
.chs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chp{padding:10px 16px;border-radius:99px;background:var(--c2);color:var(--tx);font-weight:700;white-space:nowrap;border:1px solid var(--ln)}.chp.on{background:var(--ac);color:#0f1110;border-color:var(--ac)}
.tr{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}.tr:last-child{border:0}.tr small{display:block}
.l{display:flex;align-items:center;gap:12px}.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:rgba(204,243,90,.14);color:var(--ac)}.dot.w{background:rgba(255,123,123,.14);color:var(--bad)}
.empty{text-align:center;color:var(--mu);padding:14px;font-size:14px}.msg{font-size:13px;color:var(--mu);margin-top:8px}main>h2{margin:22px 2px 10px}
.ot{display:flex;align-items:center;gap:14px}.ot small{width:30px}.ot a{color:var(--mu);cursor:pointer}.pl{flex:1;height:3px;background:var(--c2);border-radius:9px}.pl i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .5s}
.art{display:grid;place-items:center;margin:22px 0 6px}.cp{color:var(--mu);text-align:center;line-height:1.5;margin:0 12px}.fl{animation:bob 3s ease-in-out infinite}.fl:nth-child(even){animation-delay:-1.5s}@keyframes bob{50%{transform:translateY(-8px)}}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;background:var(--ac);color:#0f1110;padding:11px 18px;border-radius:99px;font-weight:800;z-index:100;animation:toast 2.4s both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-20px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sc{perspective:1100px;width:100%;max-width:340px;aspect-ratio:340/214;margin:6px auto 16px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}.sc:active{cursor:grabbing}
.c3{position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;border-radius:22px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 30px 50px -24px rgba(204,243,90,.3),0 0 0 1px rgba(255,255,255,.06)}.face svg{display:block;width:100%;height:100%;pointer-events:none}.bk{transform:rotateY(180deg)}
.gl{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);background-size:260% 100%;mix-blend-mode:overlay}
.hint{color:var(--mu);font-size:12px;flex:1;text-align:center}
.pay{background:rgba(204,243,90,.12);border-color:rgba(204,243,90,.3);font-size:14px}
.brand{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px;font-weight:800;font-size:22px;letter-spacing:-.02em}
</style></head><body><main id="app"></main><div id="dock"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),KEY='crestline.v1',CFG=window.CONFIG||{};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);
const iso=d=>d.toLocaleDateString('en-CA'),fd=d=>new Date(d+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
const sum=(a,f)=>a.reduce((x,y)=>x+ +f(y),0),MS=[100,250,500,1000,2500,5000,10000,25000,50000,100000];
const def=()=>({name:'',done:false,tx:[],hide:false,notif:{on:false,time:'09:00',last:''},pay:{on:false,day:5,time:'09:00',last:''}});
let S=Object.assign(def(),JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('vaultly.v1')||localStorage.getItem('safespend.v2')||localStorage.getItem('safespend.v1')||'{}'));
if(!S.tx.length){const d=(S.deposits||[]).map(x=>({a:+x.a,d:x.d,t:x.t})),s0=+(S.goal&&S.goal.saved)||0;if(s0)d.unshift({a:s0,d:iso(new Date()),t:1});S.tx=d.length?d:(S.goals||[]).filter(g=>g.saved>0).map(g=>({a:+g.saved,d:iso(new Date()),t:2}))}
['goals','goal','deposits','spends','bills','income'].forEach(k=>delete S[k]);if(S.tx.length)S.done=true;if(!S.pay)S.pay=def().pay;
let V=S.done?'home':'onb',ob=0,pick=10,msg='',pmsg='',sb=null,user=null,t0;
if(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase)sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
function save(){localStorage.setItem(KEY,JSON.stringify(S));if(sb&&user){clearTimeout(t0);t0=setTimeout(()=>sb.from('user_data').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()}),600)}}
const total=()=>sum(S.tx,x=>x.a);
const I={set:'<svg viewBox="0 0 24 24"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',eye:'<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>'};
const coin=(x,y,r,d)=>`<g class="fl" style="animation-delay:${d}s"><ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*1.2}" fill="#ccf35a" transform="rotate(-20 ${x} ${y})"/><text x="${x}" y="${y+r*.4}" text-anchor="middle" font-size="${r}" font-weight="800" fill="#0f1110">$</text></g>`;
const ART=`<svg viewBox="0 0 260 220" width="270"><g fill="none" stroke="#f4f6f2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M96 70c-14 14-22 34-22 62 0 34 18 54 56 54s56-20 56-54c0-28-8-48-22-62"/><path d="M104 70v-14h52v14"/><path d="M98 70h64M92 120c14 10 62 10 76 0"/><path d="M30 110c14-6 24 2 34 18M232 100c-10 4-18 14-22 28"/></g>${coin(70,50,13,0)}${coin(196,52,15,-.6)}${coin(40,150,11,-1.1)}${coin(224,160,12,-1.7)}${coin(130,30,10,-2.2)}<path d="M214 20l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ccf35a"/></svg>`;
const OB=[['Save Anything.','Any Amount.','Add $10 or $1,000 — every deposit counts and builds your balance.'],['Track Every Dollar.','Stay on Top.','See your full history and watch your savings grow over time.'],['What should we','call you?','']];
const txr=(x,d)=>`<div class="tr"><div class="l"><div class="dot ${x.a<0?'w':''}">${x.a<0?'↓':'↑'}</div><div>${x.a<0?'Withdrawal':'Deposit'}<small>${fd(x.d)}</small></div></div><div><b class="${x.a<0?'bad':'ok'}">${x.a<0?'−':'+'}${M(Math.abs(x.a))}</b>${d?` <button class="x" data-a="dt" data-v="${x.t}">✕</button>`:''}</div></div>`;
const bk=t=>`<div class="top"><button class="ib" data-a="go" data-v="home">${I.back}</button><div class="gr"><b>${t}</b></div></div>`;
const SH='M256 96L376 138V244C376 328 322 382 256 416C190 382 136 328 136 244V138Z',MT='M172 304L230 216L260 260L296 204L340 304Z',LN='M178 330H334';
const MARK=n=>`<svg viewBox="120 80 272 352" width="${n*272/352}" height="${n}"><defs><linearGradient id="lm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6ff80"/><stop offset="1" stop-color="#b4de3a"/></linearGradient></defs><path d="${SH}" fill="url(#lm)"/><path d="${MT}" fill="#0f1110"/><path d="${LN}" stroke="#0f1110" stroke-width="12" stroke-linecap="round"/></svg>`;
const CARD=(t,mo)=>{const nm=esc((S.name||'Your name').toUpperCase());return`<div class="sc" id="sc"><div class="c3" id="c3">
<div class="face"><svg viewBox="0 0 340 214" font-family="Manrope,system-ui,sans-serif"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6ff80"/><stop offset="1" stop-color="#b4de3a"/></linearGradient><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#262c27"/><stop offset="1" stop-color="#0b0d0c"/></linearGradient><radialGradient id="cr" cx="92%" cy="0%" r="85%"><stop offset="0" stop-color="#ccf35a" stop-opacity=".55"/><stop offset="1" stop-color="#ccf35a" stop-opacity="0"/></radialGradient></defs><rect width="340" height="214" fill="url(#cg)"/><rect width="340" height="214" fill="url(#cr)"/><circle cx="300" cy="190" r="64" fill="none" stroke="#ccf35a" stroke-opacity=".12" stroke-width="2"/><circle cx="300" cy="190" r="42" fill="none" stroke="#ccf35a" stroke-opacity=".12" stroke-width="2"/>
<g transform="translate(26 22) scale(.085) translate(-136 -96)"><path d="${SH}" fill="url(#lg)"/><path d="${MT}" fill="#0f1110"/><path d="${LN}" stroke="#0f1110" stroke-width="12" stroke-linecap="round"/></g><text x="56" y="44" font-size="19" font-weight="800" fill="#f4f6f2">Crestline</text>
<path d="M292 28c6 6 6 16 0 22M300 24c9 9 9 24 0 33M308 20c12 12 12 32 0 44" fill="none" stroke="#f4f6f2" stroke-opacity=".7" stroke-width="2.5" stroke-linecap="round"/>
<rect x="28" y="80" width="46" height="36" rx="7" fill="#d9b95a"/><path d="M28 98h46M45 80v36M57 80v36" stroke="#8a6d1f" stroke-width="1.5" fill="none" opacity=".7"/>
<text x="28" y="140" font-size="11" fill="#8d948e">Total savings</text><text x="28" y="168" font-size="30" font-weight="800" fill="#f4f6f2">${S.hide?'••••••':M(t)}</text>
<text x="28" y="197" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#f4f6f2" fill-opacity=".8">${nm}</text><text x="312" y="197" font-size="11.5" font-weight="800" letter-spacing="1.5" text-anchor="end" fill="#ccf35a">SAVINGS</text></svg><div class="gl"></div></div>
<div class="face bk"><svg viewBox="0 0 340 214" font-family="Manrope,system-ui,sans-serif"><rect width="340" height="214" fill="url(#cg)"/><rect width="340" height="214" fill="url(#cr)"/><rect y="26" width="340" height="42" fill="#000" opacity=".85"/><rect x="24" y="92" width="214" height="34" rx="6" fill="#f4f6f2" opacity=".92"/><text x="34" y="114" font-size="14" font-style="italic" fill="#0f1110">Crestline savings</text><rect x="248" y="92" width="68" height="34" rx="6" fill="#ccf35a"/><text x="282" y="114" font-size="15" font-weight="800" text-anchor="middle" fill="#0f1110">•••</text>
<text x="24" y="156" font-size="11" fill="#8d948e">Saved this month</text><text x="24" y="184" font-size="26" font-weight="800" fill="#ccf35a">${S.hide?'••••':'+'+M(mo)}</text><text x="316" y="196" font-size="12" font-weight="800" text-anchor="end" fill="#f4f6f2" fill-opacity=".6">crestline</text></svg><div class="gl"></div></div></div></div>`};
let cs={ry:0,rx:0,vy:0,drag:0,lx:0,ly:0,mv:0,raf:0};
function cardInit(){const sc=$('#sc'),c=$('#c3');if(!sc)return;let last=performance.now();const gls=$$('.gl');
sc.addEventListener('pointerdown',e=>{cs.drag=1;cs.lx=e.clientX;cs.ly=e.clientY;cs.mv=0;cs.vy=0;sc.setPointerCapture(e.pointerId)});
sc.addEventListener('pointermove',e=>{if(!cs.drag)return;const dx=e.clientX-cs.lx,dy=e.clientY-cs.ly;cs.lx=e.clientX;cs.ly=e.clientY;cs.mv+=Math.abs(dx)+Math.abs(dy);cs.ry+=dx*.8;cs.vy=dx*.8;cs.rx=Math.max(-28,Math.min(28,cs.rx-dy*.3))});
const up=()=>{if(!cs.drag)return;cs.drag=0;if(cs.mv<6)cs.vy=(Math.random()>.5?1:-1)*24};sc.addEventListener('pointerup',up);sc.addEventListener('pointercancel',up);
(function tick(t){if(!document.body.contains(c))return;const dt=Math.min(32,t-last)/16;last=t;
if(!cs.drag){if(Math.abs(cs.vy)>.5){cs.ry+=cs.vy*dt;cs.vy*=Math.pow(.95,dt)}else{cs.vy=0;const tg=Math.round(cs.ry/180)*180+Math.sin(t/1300)*6;cs.ry+=(tg-cs.ry)*.09*dt}cs.rx+=(Math.sin(t/900)*4-cs.rx)*.06*dt}
c.style.transform=`rotateX(${cs.rx}deg) rotateY(${cs.ry}deg)`;const p=50+Math.sin(cs.ry*Math.PI/180)*70;gls.forEach(g=>g.style.backgroundPosition=p+'% 50%');cs.raf=requestAnimationFrame(tick)})(last)}
const P={
onb(){const o=OB[ob],last=ob===2;return[`<div class="ot"><small>${ob+1}/3</small><div class="pl"><i style="width:${(ob+1)*33.4}%"></i></div><a data-a="skip">Skip</a></div>${ob===0?'<div class="brand">'+MARK(36)+'<span>Crestline</span></div>':''}<div class="art">${ART}</div><h1>${o[0]}<br><span>${o[1]}</span></h1>${last?`<input id="nm" placeholder="Your name" value="${esc(S.name)}" autocomplete="given-name">`:`<p class="cp">${o[2]}</p>`}`,`<div class="dock"><button class="pri" data-a="next">${last?'Get started':'Continue'}</button></div>`]},
home(){const t=total(),ym=iso(new Date()).slice(0,7),mo=sum(S.tx.filter(x=>x.d.startsWith(ym)&&x.a>0),x=>x.a),l=[...S.tx].sort((a,b)=>b.t-a.t).slice(0,5);
return[`<div class="top"><div class="av">${esc((S.name||'U')[0].toUpperCase())}</div><div class="gr"><b>Hello, ${esc(S.name||'there')}</b><small>Your savings, simplified</small></div><button class="ib" data-a="go" data-v="set">${I.set}</button></div>
${CARD(t,mo)}<div class="row" style="margin-bottom:14px"><span class="tag">▲ ${S.hide?'••••':M(mo)} this month</span><span class="hint">Drag or tap the card ✨</span><button class="ib" data-a="eye">${I.eye}</button></div>${S.pay.on&&new Date().getDay()===+S.pay.day?'<div class="card pay">💸 <b>It’s payday!</b> Pay yourself first and add something to savings today.</div>':''}
<div class="card"><h2 style="margin-bottom:12px">Add savings</h2><div class="chs">${[5,10,25,50,100].map(v=>`<button class="chp ${pick===v?'on':''}" data-a="amt" data-v="${v}">$${v}</button>`).join('')}</div><div class="row"><input id="ca" type="number" inputmode="decimal" placeholder="Or enter any amount"><button class="ghost" data-a="out">Withdraw</button></div></div>
<div class="sh"><h2>Recent activity</h2>${S.tx.length>5?'<a data-a="go" data-v="hist">View All ›</a>':''}</div><div class="card">${l.map(x=>txr(x)).join('')||'<div class="empty">No savings yet. Add your first deposit below!</div>'}</div>`,`<div class="dock"><button class="pri" id="dk" data-a="add">Add ${M(pick).replace('.00','')} to savings</button></div>`]},
hist(){const l=[...S.tx].sort((a,b)=>b.t-a.t).slice(0,200);return[bk('Transaction history')+`<div class="card">${l.map(x=>txr(x,1)).join('')||'<div class="empty">No transactions yet.</div>'}</div>`]},
set(){const nO='Notification' in window;return[bk('Settings')+`<h2>You</h2><div class="card" style="margin-top:10px"><label style="margin-top:0">Name</label><input id="nm2" value="${esc(S.name)}"></div>
<h2>Daily reminder</h2><div class="card" style="margin-top:10px"><div class="tr" style="border:0;padding-top:0"><span>Remind me to save</span><button class="${S.notif.on?'pri sm':'ghost'}" data-a="nt">${S.notif.on?'On':'Off'}</button></div><label>Time</label><input id="nz" type="time" value="${S.notif.time}"><p class="msg">${nO?'Reminders fire when the app is opened after your set time.':'Not supported here. On iPhone, add to Home Screen first.'}</p></div>
<h2>Payday reminder</h2><div class="card" style="margin-top:10px"><div class="tr" style="border:0;padding-top:0"><span>Remind me to save on payday</span><button class="${S.pay.on?'pri sm':'ghost'}" data-a="pt">${S.pay.on?'On':'Off'}</button></div><label>Payday</label><select id="pd">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((d,i)=>`<option value="${i}" ${i==S.pay.day?'selected':''}>Every ${d}</option>`).join('')}</select><label>Time</label><input id="pz" type="time" value="${S.pay.time}"><p class="msg">${esc(pmsg)||'You’ll get a notification and a banner on Home that day.'}</p></div>
<h2>Account</h2><div class="card" style="margin-top:10px">${sb?(user?`<small>Signed in as ${esc(user.email)}</small><div style="height:10px"></div><button class="ghost" data-a="so">Sign out</button>`:`<label style="margin-top:0">Email</label><input id="em" type="email" autocomplete="email"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><div class="row" style="margin-top:12px"><button class="pri sm" data-a="in">Sign in</button><button class="ghost" data-a="up">Sign up</button></div>`):'<small>Accounts aren’t set up yet. Your data is saved on this device.</small>'}<p class="msg">${esc(msg)}</p></div>`]}};
function render(){const h=P[V]();$('#app').innerHTML=h[0];$('#dock').innerHTML=h[1]||'';scrollTo(0,0);cancelAnimationFrame(cs.raf);if(V==='home')cardInit()}
function burst(n){const cs=['#ccf35a','#f4f6f2','#6fd6a0','#fbbf24'];for(let i=0;i<n;i++){const e=document.createElement('i'),z=6+Math.random()*8;Object.assign(e.style,{position:'fixed',left:'50%',top:'30%',width:z+'px',height:z+'px',borderRadius:i%2?'50%':'2px',background:cs[i%4],zIndex:99,pointerEvents:'none'});document.body.appendChild(e);const a=Math.random()*6.28,d=80+Math.random()*180;e.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+120}px) rotate(${Math.random()*540}deg) scale(.4)`,opacity:0}],{duration:900+Math.random()*700,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>e.remove()}}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}
function addTx(a){const t=total();if(a<0)a=-Math.min(-a,t);if(!a)return toast('Nothing to withdraw');S.tx.push({a,d:iso(new Date()),t:Date.now()});save();const f=t+a;render();
if(a>0){burst(24);const m=MS.filter(x=>t<x&&f>=x).pop();if(m){burst(70);const s='🎉 You reached '+M(m)+'!';toast(s);if(S.notif.on)notify('Milestone!',s)}else toast('+'+M(a)+' saved')}else toast('Withdrew '+M(-a))}
const amt=()=>{const c=parseFloat($('#ca').value);return c>0?c:pick},upd=()=>{const d=$('#dk');if(d)d.textContent='Add '+M(amt()).replace('.00','')+' to savings'};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,v=t.dataset.v;
if(a==='go'){V=v;msg='';pmsg='';render()}
else if(a==='next'){if(ob<2)ob++;else{S.name=($('#nm').value||'').trim();S.done=true;save();V='home'}render()}
else if(a==='skip'){S.done=true;save();V='home';render()}
else if(a==='eye'){S.hide=!S.hide;save();render()}
else if(a==='amt'){pick=+v;$('#ca').value='';$$('[data-a=amt]').forEach(b=>b.classList.toggle('on',b===t));upd()}
else if(a==='add')addTx(amt());else if(a==='out')addTx(-amt());
else if(a==='dt'){S.tx=S.tx.filter(x=>x.t!=v);save();render()}
else if(a==='nt'){if(!S.notif.on){if(!('Notification' in window))return;const p=await Notification.requestPermission();if(p!=='granted'){msg='Permission blocked in browser settings.';return render()}S.notif.on=true;save();notify('Reminders on','We’ll nudge you to save each day.')}else{S.notif.on=false;save()}render()}
else if(a==='pt'){if(!S.pay.on&&'Notification' in window&&Notification.permission==='default')await Notification.requestPermission();S.pay.on=!S.pay.on;pmsg=S.pay.on&&'Notification' in window&&Notification.permission!=='granted'?'Notifications are off, so you’ll just see the banner on Home.':'';save();render()}
else if(a==='in'||a==='up'){const e2=$('#em').value,pw=$('#pw').value,r=a==='in'?await sb.auth.signInWithPassword({email:e2,password:pw}):await sb.auth.signUp({email:e2,password:pw});msg=r.error?r.error.message:(a==='up'&&!r.data.session?'Check your email to confirm, then sign in.':'');if(!r.error&&r.data.session)await onUser(r.data.session.user);render()}
else if(a==='so'){await sb.auth.signOut();user=null;render()}});
document.addEventListener('change',e=>{const i=e.target.id,v=e.target.value;if(i==='nm2')S.name=v.trim();else if(i==='pd')S.pay.day=+v;else if(i==='pz')S.pay.time=v;else if(i==='nz')S.notif.time=v;else return;save()});
document.addEventListener('input',e=>{if(e.target.id==='ca'){$$('[data-a=amt]').forEach(b=>b.classList.remove('on'));upd()}});
async function notify(title,body){body=body||('Time to save! Your balance is '+M(total())+'.');title=title||'Crestline';try{const r=await navigator.serviceWorker.getRegistration();r?r.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png'}):new Notification(title,{body})}catch(e){}}
function checkReminder(){if(!('Notification' in window)||Notification.permission!=='granted')return;const n=new Date(),t=iso(n),mins=n.getHours()*60+n.getMinutes(),at=x=>{const[h,m]=x.split(':');return mins>=+h*60+ +m};
if(S.notif.on&&S.notif.last!==t&&at(S.notif.time)){S.notif.last=t;save();notify()}
if(S.pay.on&&n.getDay()===+S.pay.day&&S.pay.last!==t&&at(S.pay.time)){S.pay.last=t;save();notify('Payday! 💸','Pay yourself first. Add something to your savings today.')}}
setInterval(checkReminder,6e4);document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminder();if(V==='home')render()}});
async function onUser(u){user=u;const{data}=await sb.from('user_data').select('data').eq('user_id',u.id).maybeSingle();if(data&&data.data&&Object.keys(data.data).length){S=Object.assign(def(),data.data);S.done=true;if(!S.pay)S.pay=def().pay;if(!Array.isArray(S.tx))S.tx=[];localStorage.setItem(KEY,JSON.stringify(S));V='home'}else save()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
(async()=>{if(sb){const{data}=await sb.auth.getSession();if(data.session)await onUser(data.session.user)}render();checkReminder()})();
</script></body></html>
